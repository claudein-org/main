alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

databases:
  - cluster_name: claudin-org
    db_name: defaultdb
    db_user: doadmin
    engine: PG
    version: "18"
    name: claudin
    production: true

domains:
  - domain: claudein.org
    type: PRIMARY

features:
  - buildpack-stack=ubuntu-22
ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /

# WEB SERVICE
name: claudin-org
region: nyc3
services:
  - name: web
    github:
      branch: main
      deploy_on_push: true
      repo: claudein-org/main

    source_dir: /
    dockerfile_path: /Dockerfile

    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xs

# ANALYTICS SYNC JOB
# Pulls per-post metrics from the provider APIs into post_metrics. Built from
# /Dockerfile.job — the web image is a Next.js standalone build and does NOT
# contain web/jobs/sync.ts. Recurring scheduling is configured on the
# DigitalOcean job itself; `kind` below is the in-spec trigger (runs once after
# each deploy — the sync is idempotent, so re-running is safe).
#
# Every secret — DB_*, the OAuth/cookie secrets, and SPACE_SECRET_KEY — is an
# app-level secret set in the DO dashboard, so all components inherit it. Never
# re-declare a secret under a component: a component-level `type: SECRET` with no
# `value:` shadows the app-level one with an empty string.
jobs:
  - name: analytics-sync
    dockerfile_path: /Dockerfile.job
    github:
      branch: main
      deploy_on_push: true
      repo: claudein-org/main
    instance_count: 1
    instance_size_slug: basic-xxs
    kind: SCHEDULED
    run_command: cd web && bun jobs/sync.ts
    schedule:
      cron: "0 0 * * *"
    source_dir: /
    timeout: 900s

