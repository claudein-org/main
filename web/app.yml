alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

databases:
  - cluster_name: claudin-org
    db_name: defaultdb
    db_user: doadmin
    engine: PG
    version: "18"
    name: claudin
    production: true

domains:
  - domain: claudein.org
    type: PRIMARY

features:
  - buildpack-stack=ubuntu-22
ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /

# WEB SERVICE
name: claudin-org
region: nyc3
services:
  - name: web
    github:
      branch: main
      deploy_on_push: true
      repo: claudein-org/main

    source_dir: /
    dockerfile_path: /Dockerfile

    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xs

    envs:
      - key: SPACE_SECRET_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET

# ANALYTICS SYNC JOB
# Pulls per-post metrics from the provider APIs into post_metrics. Built from
# /Dockerfile.job — the web image is a Next.js standalone build and does NOT
# contain web/jobs/sync.ts. Recurring scheduling is configured on the
# DigitalOcean job itself; `kind` below is the in-spec trigger (runs once after
# each deploy — the sync is idempotent, so re-running is safe).
#
# The job needs the same env as the web service: DB_* and the OAuth/cookie
# secrets are app-level secrets (set in the DO dashboard) and are inherited;
# SPACE_SECRET_KEY is declared per-component, so it is repeated here.
jobs:
  - name: analytics-sync
    kind: POST_DEPLOY
    github:
      branch: main
      deploy_on_push: true
      repo: claudein-org/main

    source_dir: /
    dockerfile_path: /Dockerfile.job

    instance_count: 1
    instance_size_slug: basic-xxs

    envs:
      - key: SPACE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
